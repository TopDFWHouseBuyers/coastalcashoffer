name: Generate Blog Post

on:
  schedule:
    - cron: '0 14 * * 1'   # Monday 9am CT
    - cron: '0 14 * * 3'   # Wednesday 9am CT
    - cron: '0 14 * * 5'   # Friday 9am CT
    - cron: '0 14 * * 6'   # Saturday 9am CT
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Generate blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_post.py

      - name: Rebuild blog index
        run: python scripts/generate_blog_index.py

      - name: Update sitemap
        run: python scripts/generate_sitemap.py

      - name: Commit and push
        run: |
          git config --global user.name "Coastal Cash Offer Bot"
          git config --global user.email "bot@coastalcashoffer.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto: New blog post $(date '+%A %B %d %Y')"
          git push
